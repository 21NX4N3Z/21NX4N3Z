<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 160" width="900" height="160">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07030f"/>
      <stop offset="1" stop-color="#0d0620"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#c084fc" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0 L0 0 0 30" fill="none" stroke="#1e0f38" stroke-width="0.5" opacity="0.5"/>
    </pattern>
  </defs>

  <rect width="900" height="160" fill="url(#bg)"/>
  <rect width="900" height="160" fill="url(#grid)"/>

  <rect x="0" y="0" width="900" height="160" fill="url(#line)" opacity="0.08">
    <animate attributeName="x" values="-900;900" dur="6s" repeatCount="indefinite"/>
  </rect>

  <text x="450" y="78" text-anchor="middle" font-family="Courier New, monospace" font-size="54" font-weight="bold" fill="#c084fc" filter="url(#glow)">21NX4N3Z</text>
  <text x="450" y="116" text-anchor="middle" font-family="Courier New, monospace" font-size="20" fill="#d8c8f0" opacity="0.8">developer · tooling · dashboards</text>

  <line x1="120" y1="135" x2="780" y2="135" stroke="url(#line)" stroke-width="2"/>
  <circle cx="120" cy="135" r="3.5" fill="#a855f7" filter="url(#glow)">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="780" cy="135" r="3.5" fill="#c084fc" filter="url(#glow)">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" repeatCount="indefinite"/>
  </circle>
</svg>
