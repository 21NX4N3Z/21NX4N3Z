name: Graphics

on:
  schedule: [{ cron: "0 3 * * *" }]
  push: { branches: ["master"] }
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # stats.svg + status.svg + languages.svg — hand-drawn obsidian-violet cards,
      # live data (public non-fork repos, language bytes, stars).
      - name: Generate profile cards
        env:
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: python3 scripts/gen_svgs.py

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stats.svg status.svg languages.svg
          git diff --staged --quiet || git commit -m "chore: update profile cards [skip ci]"
          git pull --rebase
          git push
