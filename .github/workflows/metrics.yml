name: Metrics
on:
  schedule: [{ cron: "0 0 * * *" }]
  push: { branches: ["master"] }
  workflow_dispatch:
permissions:
  contents: write
jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # ── ISOMETRIC CALENDAR (3D graphic) ──
      - name: Generate isocalendar
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.METRICS_TOKEN }}
          user: 21NX4N3Z
          base: ""
          filename: isocalendar-full.svg
          config_timezone: Asia/Bangkok
          config_display: large
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
      # ── CUSTOM SVGS (overview + languages, pure SVG renders on GitHub) ──
      - name: Generate custom svgs
        env:
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: python scripts/gen_svgs.py
      # ── LINES HISTORY (graph) ──
      # note: languages.svg is generated locally (custom script) — GitHub cannot render
      # lowlighter's foreignObject output inside README, so we keep the hand-made bars.
      - name: Generate lines history
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.METRICS_TOKEN }}
          user: 21NX4N3Z
          base: ""
          filename: lines-history.svg
          config_timezone: Asia/Bangkok
          plugin_lines: yes
          plugin_lines_sections: history
          plugin_lines_history_limit: 1
      - name: Commit graphics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add isocalendar-full.svg lines-history.svg overview.svg languages.svg
          git diff --staged --quiet || git commit -m "chore: update metric graphics [skip ci]"
          git push
