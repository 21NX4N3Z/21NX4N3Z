<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 180" width="180">
<defs><filter id="g"><feGaussianBlur stdDeviation="1.8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<!-- pixel robot · obsidian violet -->
<g shape-rendering="crispEdges" transform="translate(30,10)">
  <!-- antenna -->
  <rect x="80" y="0" width="8" height="12" fill="#7c5cff"/>
  <circle cx="84" cy="2" r="5" fill="#f0abfc"><animate attributeName="opacity" values="1;.2;1" dur="1.4s" repeatCount="indefinite"/></circle>
  <!-- head -->
  <rect x="32" y="16" width="104" height="76" rx="10" fill="#120826" stroke="#a855f7" stroke-width="3"/>
  <!-- eyes -->
  <g filter="url(#g)">
    <rect x="52" y="38" width="20" height="20" fill="#c084fc"><animate attributeName="height" values="20;4;20" keyTimes="0;0.06;0.12" dur="4s" repeatCount="indefinite"/></rect>
    <rect x="96" y="38" width="20" height="20" fill="#c084fc"><animate attributeName="height" values="20;4;20" keyTimes="0;0.06;0.12" dur="4s" repeatCount="indefinite"/></rect>
  </g>
  <!-- mouth: laughing bars -->
  <g fill="#a855f7">
    <rect x="60" y="70" width="8" height="6"><animate attributeName="y" values="70;74;70" dur="0.9s" repeatCount="indefinite"/></rect>
    <rect x="74" y="70" width="8" height="6"><animate attributeName="y" values="70;76;70" dur="0.9s" repeatCount="indefinite"/></rect>
    <rect x="88" y="70" width="8" height="6"><animate attributeName="y" values="70;74;70" dur="0.9s" repeatCount="indefinite"/></rect>
  </g>
  <!-- body -->
  <rect x="48" y="98" width="72" height="44" rx="8" fill="#150a26" stroke="#7c5cff" stroke-width="3"/>
  <!-- chest lights -->
  <circle cx="66" cy="118" r="5" fill="#c084fc"><animate attributeName="opacity" values="1;.15;1" dur="1s" repeatCount="indefinite"/></circle>
  <circle cx="84" cy="118" r="5" fill="#a855f7"><animate attributeName="opacity" values=".15;1;.15" dur="1s" repeatCount="indefinite"/></circle>
  <circle cx="102" cy="118" r="5" fill="#7c5cff"><animate attributeName="opacity" values="1;.15;1" dur="1.3s" repeatCount="indefinite"/></circle>
  <!-- arms waving -->
  <g stroke="#7c5cff" stroke-width="6" stroke-linecap="round">
    <line x1="48" y1="106" x2="28" y2="122"/>
    <line x1="120" y1="106" x2="140" y2="100">
      <animate attributeName="y2" values="122;96;122" dur="1.6s" repeatCount="indefinite"/>
    </line>
  </g>
</g>
</svg>
