<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 12" width="800" height="12">
  <defs>
    <linearGradient id="d" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#c084fc"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="60" y="5" width="680" height="2" rx="1" fill="url(#d)"/>
  <circle cx="400" cy="6" r="3.5" fill="#c084fc">
    <animate attributeName="r" values="3.5;2;3.5" dur="1.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;.5;1" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="120" cy="6" r="2" fill="#7c5cff"><animate attributeName="opacity" values=".3;1;.3" dur="2.4s" repeatCount="indefinite"/></circle>
  <circle cx="680" cy="6" r="2" fill="#f0abfc"><animate attributeName="opacity" values="1;.3;1" dur="2.9s" repeatCount="indefinite"/></circle>
</svg>
